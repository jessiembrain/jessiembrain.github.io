<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Philly Bars Map</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .container {
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 32%;
    overflow-y: auto;
    background: #f4f4f4;
    padding: 10px;
  }

  #map {
    width: 68%;
  }

  .search {
    margin-bottom: 10px;
  }

  .search input {
    width: 100%;
    padding: 8px;
    font-size: 14px;
  }

  .card {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    gap: 10px;
  }

  .card img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
  }

  .card.active {
    border: 2px solid teal;
  }

  .card h3 {
    margin: 0;
    font-size: 16px;
  }

  .card p {
    margin: 4px 0;
    font-size: 12px;
  }
</style>
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="search">
      <input type="text" id="search" placeholder="Search anything...">
    </div>
    <div id="list"></div>
  </div>

  <!-- Map -->
  <div id="map"></div>

</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiamJyYWluMSIsImEiOiJjbG85MTNmZW8wNW80MnFwbTRiZXJmNGZuIn0.4Ajv4kTvH6rx0ym0AmE-gQ';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v10',
  center: [-75.1652, 39.9526],
  zoom: 14
});

const locations = [
  {
    name: "1518 Bar & Grill",
    address: "1518 Sansom St",
    lat: 39.9509,
    lng: -75.1651,
    img: "https://images.unsplash.com/photo-1552566626-52f8b828add9"
  },
  {
    name: "Aki Nom Nom",
    address: "1210 Walnut St",
    lat: 39.9495,
    lng: -75.1662,
    img: "https://images.unsplash.com/photo-1555992336-03a23c7b20ee"
  },
  {
    name: "Balcony Bar",
    address: "300 S Broad St",
    lat: 39.9472,
    lng: -75.1645,
    img: "https://images.unsplash.com/photo-1544148103-0773bf10d330"
  },
  {
    name: "Bar Bombon",
    address: "133 S 18th St",
    lat: 39.9502,
    lng: -75.1695,
    img: "https://images.unsplash.com/photo-1582450871972-ab5ca641643d"
  }
];

const listEl = document.getElementById("list");
let markers = [];

function renderList(data) {
  listEl.innerHTML = "";

  data.forEach((loc, index) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${loc.img}"dress}</p>
      </div>
    `;

    card.onclick = () => {
      map.flyTo({
        center: [loc.lng, loc.lat],
        zoom: 16
      });

      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    };

    listEl.appendChild(card);
  });
}

function renderMarkers(data) {
  markers.forEach(m => m.remove());
  markers = [];

  data.forEach(loc => {
    const marker = new mapboxgl.Marker({ color: "teal" })
      .setLngLat([loc.lng, loc.lat])
      .setPopup(new mapboxgl.Popup().setHTML(`<strong>${loc.name}</strong><br>${loc.address}`))
      .addTo(map);

    markers.push(marker);
  });
}

// Initial load
renderList(locations);
renderMarkers(locations);

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const value = e.target.value.toLowerCase();

  const filtered = locations.filter(loc =>
    loc.name.toLowerCase().includes(value) ||
    loc.address.toLowerCase().includes(value)
  );

  renderList(filtered);
  renderMarkers(filtered);
});
</script>

</body>
</html>
